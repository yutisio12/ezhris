version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - hris-network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: hris-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hris-network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: hris-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hris
      POSTGRES_USER: hris_user
      POSTGRES_PASSWORD: secret
      POSTGRES_ROOT_PASSWORD: root_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hris-network

  redis:
    image: redis:7-alpine
    container_name: hris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hris-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    networks:
      - hris-network
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    networks:
      - hris-network
    depends_on:
      - db
      - redis

  mailpit:
    image: axllent/mailpit:latest
    container_name: hris-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - hris-network

networks:
  hris-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
